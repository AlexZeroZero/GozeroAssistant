[package]
name = "gozero-mds-core"
version = "0.1.11"
edition = "2021"
license = "GPL-3.0-only"
[[bin]]
name = "GozeroMdsCore"
path = "src/main.rs"
[dependencies]
anyhow = "1.0"
bincode = "1.3"
blake3 = "1.5"
serde = {version="1.0",features=["derive"]}
serde_json = "1.0"
rand = "0.8"
rand_chacha = "0.3"
hex = "0.4"
rayon = "1.8"
primitive-types = "0.14"
im = {version="15.1",features=["serde"]}
smallvec = "1.15.1"
tracing = "0.1"
tracing-subscriber = {version="0.3",features=["env-filter"]}
toml = "1.0.3"
wgpu = "29"
pollster = "0.3"
bytemuck = {version="1",features=["derive"]}
clap = {version="4.5",features=["derive"]}
libloading = "0.8.9"
tokio = {version="1",features=["full"]}
reqwest = {version="0.11",default-features=false,features=["json","rustls-tls"]}
ctrlc = "3.4"
[profile.release]
opt-level=3
lto="thin"
codegen-units=1
strip=true
[features]
fast-mining=[]
