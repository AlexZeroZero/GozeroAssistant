[package]
name = "jetsam_poseidon2b"
version.workspace = true
edition = "2021"

[features]
# Test-chain identity. Never enable for a mainnet release: it changes the
# address HRP, so a build carrying it cannot read or write mainnet addresses.
testnet = []

[dependencies]
jetsam_core = { path = "../jetsam_core" }
rayon = "1.10"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
bech32 = "0.11"
hex    = "0.4"

[dev-dependencies]
static_assertions = "1.1"
