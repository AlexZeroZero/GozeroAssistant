<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>Gozero助手 · 悬浮监控</title><link rel="stylesheet" href="mini.css"></head><body><div class="monitor-card"><header><img src="logo.svg" alt="Gozero"><b>Gozero助手</b><span id="phase">待机</span><button id="restore" title="返回主窗口">↗</button><button id="hide" title="关闭卡片，继续在系统托盘运行" aria-label="关闭到系统托盘">×</button></header><section class="hash-hero"><div class="hero-title"><small id="hash-label">设备算力均值</small><span id="budget" class="budget">均衡 · 75%</span></div><div class="hash-main"><strong id="hash">—</strong><div class="hash-activity" aria-hidden="true"><i></i><i></i><i></i><i></i></div></div><div class="device-row"><span id="device-label">等待选择GPU</span><b id="power">— W</b></div></section><section class="market-strip"><div><b id="coin">—</b><span id="price">—</span><em id="price-note"></em></div><div><small>全网</small><b id="network">—</b><em id="network-note"></em></div></section><section class="profits"><div><small>预计日净利</small><b id="day">—</b></div><div><small>7日推算</small><b id="week">—</b></div><div><small>30日推算</small><b id="month">—</b></div></section><section class="sensors"><div><span>GPU</span><b id="gpu">—</b></div><div><span>CPU</span><b id="cpu">—</b></div><div><span>内存</span><b id="memory">—</b></div><div><span>温度</span><b id="temp">—</b></div></section><footer><span id="coverage">等待设备</span><span class="mini-fee">服务费0.5%</span><button id="stop">■ 停止</button><button id="quit" title="停止全部任务并退出程序">退出</button></footer></div><script src="performance.js"></script><script src="mini.js"></script></body></html>
